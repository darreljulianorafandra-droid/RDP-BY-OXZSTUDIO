          $lines = @()
          $lines += 'Add-Type -AssemblyName PresentationFramework'
          $lines += '$msg = "========================================`n   OXZRDP PRO V4.2 - TENTANG`n========================================`n`n  Versi     : V4.2`n  Developer : Yannzz dan OxzStudios`n  Platform  : GitHub Actions + Tailscale`n`n========================================`n   FITUR AKTIF V4.2`n========================================`n  - Steam Client`n  - Microsoft Word / LibreOffice`n  - WiFi Manager`n  - Bug Reporter WhatsApp`n  - Discord, Chrome, Spotify, VLC`n  - WhatsApp, Notepad++`n  - OBS Studio, Zoom, GIMP`n  - 7-Zip, CPU-Z, CCleaner`n  - Bitwarden, Audacity, Tor Browser`n  - System Monitor, Benchmark`n  - Dark Mode, Auto-Lock, Auto-Backup`n  - Play Store + APK Downloader`n  - Theme Market`n`n========================================`n   BUG REPORT`n========================================`n  WhatsApp : +62 851-6157-1110`n  Chat     : https://wa.me/6285161571110`n`n========================================`n   WEBSITE dan COMMUNITY`n========================================`n  Website   : https://oxzratxone-official.netlify.app`n  Community : https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3`n`n========================================`n  (c) 2026 Yannzz dan OxzStudios`n========================================"'
