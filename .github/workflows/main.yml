name: OXZRDP-PRO-V4.2

on:
  workflow_dispatch:

jobs:
  deployment:
    runs-on: windows-latest
    timeout-minutes: 1440

    steps:
      # ============ STEP 1 - RDP + RENAME ============
      - name: 1. Enable RDP + Rename Device
        shell: pwsh
        continue-on-error: true
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          netsh advfirewall firewall set rule group='remote desktop' new enable=Yes
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
          $newName = "OXZRDP-PRO-$((Get-Random -Min 100 -Max 999))"
          Rename-Computer -NewName $newName -Force -ErrorAction SilentlyContinue
          Write-Host "[OK] Device: $newName"

      # ============ STEP 2 - USER + WINDOWS UPDATE ============
      - name: 2. Bikin User + Windows Update
        shell: pwsh
        continue-on-error: true
        run: |
          $id = Get-Random -Minimum 1000 -Maximum 9999
          $u = "UserOxz$id"
          $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789')
          $p = ''
          foreach ($s in $sets) { $p += $s[(Get-Random -Maximum $s.Length)] }
          $all = -join $sets
          for ($i = 1; $i -le 11; $i++) { $p += $all[(Get-Random -Maximum $all.Length)] }
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_USER=$u"
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_PASS=$p"
          net user $u $p /add /y
          net localgroup Administrators $u /add
          net localgroup 'Remote Desktop Users' $u /add
          Set-Service -Name wuauserv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name wuauserv -ErrorAction SilentlyContinue
          Write-Host "[OK] User $u dibuat"

      # ============ STEP 3 - WALLPAPER + THEME MARKET ============
      - name: 3. Wallpaper + Theme Market
        shell: pwsh
        continue-on-error: true
        run: |
          $wallPath = 'C:\Windows\Web\Wallpaper\oxzrdp.jpg'
          try {
            Invoke-WebRequest -Uri 'https://files.catbox.moe/yfz3h8.jpg' -OutFile $wallPath -UseBasicParsing -TimeoutSec 60
            Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'Wallpaper' -Value $wallPath -Force
            Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WallpaperStyle' -Value '10' -Force
            Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'TileWallpaper' -Value '0' -Force
            Write-Host '[OK] Wallpaper terpasang'
          } catch {
            Write-Host '[!] Wallpaper gagal'
          }
          
          $themeDir = 'C:\OXZRDP\Themes'
          New-Item -ItemType Directory -Path $themeDir -Force | Out-Null
          $themes = @(
            @{n='Win11-Bloom'; u='https://images.unsplash.com/photo-1633511090164-b43840ea90bf?w=1920'},
            @{n='Dark-Abstract'; u='https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1920'},
            @{n='Blue-Gradient'; u='https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=1920'},
            @{n='Space-Galaxy'; u='https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920'}
          )
          foreach ($t in $themes) {
            try {
              Invoke-WebRequest -Uri $t.u -OutFile "$themeDir\$($t.n).jpg" -UseBasicParsing -TimeoutSec 30
              Write-Host "[OK] Tema $($t.n)"
            } catch { }
          }

      # ============ STEP 4 - OPTIMASI ============
      - name: 4. Optimasi Anti Lag
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @('*Microsoft.Office*','*OneDrive*','*SkypeApp*','*XboxApp*','*BingNews*','*BingWeather*','*GetHelp*','*ZuneMusic*','*ZuneVideo*','*People*','*Maps*','*Todos*')
          foreach ($app in $apps) {
            Get-AppxPackage -Name $app -AllUsers -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue
          }
          $services = @('DiagTrack','dmwappushservice','SysMain','MapsBroker','RetailDemo','WMPNetworkSvc')
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name 'NetworkThrottlingIndex' -Value 0xffffffff -Force -ErrorAction SilentlyContinue
          netsh int tcp set global autotuninglevel=normal
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          Write-Host '[OK] Optimasi selesai'

      # ============ STEP 5 - INSTALL APPS UTAMA ============
      - name: 5. Install Apps Utama (Discord + Chrome + Spotify + VLC + Notepad++ + WhatsApp)
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @(
            @{id='Discord.Discord'; name='Discord'},
            @{id='Google.Chrome'; name='Chrome'},
            @{id='Spotify.Spotify'; name='Spotify'},
            @{id='VideoLAN.VLC'; name='VLC'},
            @{id='Notepad++.Notepad++'; name='Notepad++'},
            @{id='WhatsApp.WhatsApp'; name='WhatsApp'}
          )
          foreach ($app in $apps) {
            Write-Host "[+] Install $($app.name)..."
            try {
              winget install --id $($app.id) --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            } catch { }
          }
          Get-Process Discord -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0
          exit 0

      # ============ STEP 6 - INSTALL APPS TAMBAHAN V4.2 ============
      - name: 6. Install Apps V4.2 (Steam + Office + OBS + Zoom + GIMP + 7-Zip + dll)
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @(
            @{id='Valve.Steam'; name='Steam'},
            @{id='OBSProject.OBSStudio'; name='OBS Studio'},
            @{id='Zoom.Zoom'; name='Zoom'},
            @{id='GIMP.GIMP'; name='GIMP'},
            @{id='7zip.7zip'; name='7-Zip'},
            @{id='CPUID.CPU-Z'; name='CPU-Z'},
            @{id='Piriform.CCleaner'; name='CCleaner'},
            @{id='Bitwarden.Bitwarden'; name='Bitwarden'},
            @{id='Audacity.Audacity'; name='Audacity'},
            @{id='TorProject.TorBrowser'; name='Tor Browser'},
            @{id='TheDocumentFoundation.LibreOffice'; name='LibreOffice'}
          )
          foreach ($app in $apps) {
            Write-Host "[+] Install $($app.name)..."
            try {
              winget install --id $($app.id) --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            } catch {
              Write-Host "[!] $($app.name) gagal, skip."
            }
          }
          $global:LASTEXITCODE = 0
          exit 0

      # ============ STEP 7 - WIFI MANAGER + NETWORK TOOLS ============
      - name: 7. WiFi Manager + Network Tools
        shell: pwsh
        continue-on-error: true
        run: |
          $toolDir = 'C:\OXZRDP'
          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null
          
          # Script WiFi Manager
          $wifiScript = @'
Add-Type -AssemblyName System.Windows.Forms
Add-Type -AssemblyName System.Drawing

$form = New-Object System.Windows.Forms.Form
$form.Text = 'OXZRDP V4.2 - WiFi Manager'
$form.Size = New-Object System.Drawing.Size(700, 600)
$form.StartPosition = 'CenterScreen'
$form.BackColor = [System.Drawing.Color]::White

$lbl = New-Object System.Windows.Forms.Label
$lbl.Text = 'WIFI MANAGER - OXZRDP V4.2'
$lbl.Font = New-Object System.Drawing.Font('Segoe UI', 16, [System.Drawing.FontStyle]::Bold)
$lbl.Location = New-Object System.Drawing.Point(20, 20)
$lbl.Size = New-Object System.Drawing.Size(500, 30)
$form.Controls.Add($lbl)

$listBox = New-Object System.Windows.Forms.ListBox
$listBox.Location = New-Object System.Drawing.Point(20, 60)
$listBox.Size = New-Object System.Drawing.Size(640, 350)
$listBox.Font = New-Object System.Drawing.Font('Consolas', 10)

# Scan WiFi networks
$wifiInfo = netsh wlan show networks mode=bssid 2>$null
if ($wifiInfo) {
    foreach ($line in $wifiInfo) {
        if ($line -match '^SSID') {
            [void]$listBox.Items.Add($line.Trim())
        }
    }
} else {
    [void]$listBox.Items.Add('WiFi adapter tidak terdeteksi di VM (normal).')
    [void]$listBox.Items.Add('')
    [void]$listBox.Items.Add('Info Network VM:')
    $ipconfig = ipconfig 2>$null
    foreach ($line in $ipconfig) {
        if ($line.Trim() -ne '') {
            [void]$listBox.Items.Add($line)
        }
    }
}
$form.Controls.Add($listBox)

$btnScan = New-Object System.Windows.Forms.Button
$btnScan.Text = 'Scan Ulang'
$btnScan.Location = New-Object System.Drawing.Point(20, 430)
$btnScan.Size = New-Object System.Drawing.Size(150, 40)
$btnScan.BackColor = [System.Drawing.Color]::FromArgb(50, 120, 220)
$btnScan.ForeColor = [System.Drawing.Color]::White
$btnScan.Font = New-Object System.Drawing.Font('Segoe UI', 11, [System.Drawing.FontStyle]::Bold)
$btnScan.Add_Click({
    $listBox.Items.Clear()
    $wifi = netsh wlan show networks mode=bssid 2>$null
    if ($wifi) {
        foreach ($line in $wifi) {
            if ($line -match '^SSID') { [void]$listBox.Items.Add($line.Trim()) }
        }
    }
    $listBox.Items.Add('')
    $listBox.Items.Add('--- IP Config ---')
    $ipconfig = ipconfig 2>$null
    foreach ($line in $ipconfig) {
        if ($line.Trim() -ne '') { [void]$listBox.Items.Add($line) }
    }
})
$form.Controls.Add($btnScan)

$btnSpeed = New-Object System.Windows.Forms.Button
$btnSpeed.Text = 'Speed Test'
$btnSpeed.Location = New-Object System.Drawing.Point(180, 430)
$btnSpeed.Size = New-Object System.Drawing.Size(150, 40)
$btnSpeed.BackColor = [System.Drawing.Color]::FromArgb(60, 200, 100)
$btnSpeed.ForeColor = [System.Drawing.Color]::White
$btnSpeed.Font = New-Object System.Drawing.Font('Segoe UI', 11, [System.Drawing.FontStyle]::Bold)
$btnSpeed.Add_Click({
    Start-Process 'https://fast.com'
})
$form.Controls.Add($btnSpeed)

$btnClose = New-Object System.Windows.Forms.Button
$btnClose.Text = 'Tutup'
$btnClose.Location = New-Object System.Drawing.Point(340, 430)
$btnClose.Size = New-Object System.Drawing.Size(150, 40)
$btnClose.Font = New-Object System.Drawing.Font('Segoe UI', 11)
$btnClose.Add_Click({ $form.Close() })
$form.Controls.Add($btnClose)

$form.ShowDialog() | Out-Null
'@
          $wifiScript | Out-File -FilePath "$toolDir\WiFiManager.ps1" -Encoding utf8
          
          $Shell = New-Object -ComObject WScript.Shell
          $sc = $Shell.CreateShortcut('C:\Users\Public\Desktop\WiFi Manager.lnk')
          $sc.TargetPath = 'powershell.exe'
          $sc.Arguments = "-ExecutionPolicy Bypass -WindowStyle Hidden -File `"$toolDir\WiFiManager.ps1`""
          $sc.IconLocation = 'C:\Windows\System32\shell32.dll,17'
          $sc.Save()
          
          Write-Host '[OK] WiFi Manager terpasang'

      # ============ STEP 8 - BUG REPORTER + CHANGELOG + SHORTCUT ============
      - name: 8. Bug Reporter + Changelog + Shortcut
        shell: pwsh
        continue-on-error: true
        run: |
          $Desktop = 'C:\Users\Public\Desktop'
