name: OXZRDP-PRO-V3.2

on:
  workflow_dispatch:

jobs:
  deployment:
    runs-on: windows-latest
    timeout-minutes: 1440

    steps:
      - name: 1. Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          netsh advfirewall firewall set rule group='remote desktop' new enable=Yes
          Restart-Service -Name TermService -Force
          Write-Host '[OK] RDP aktif.'

      - name: 2. Bikin User Random
        shell: pwsh
        run: |
          $id = Get-Random -Minimum 1000 -Maximum 9999
          $u = "UserOxz$id"
          $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789')
          $p = ''
          foreach ($s in $sets) { $p += $s[(Get-Random -Maximum $s.Length)] }
          $all = -join $sets
          for ($i = 1; $i -le 11; $i++) { $p += $all[(Get-Random -Maximum $all.Length)] }
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_USER=$u"
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_PASS=$p"
          net user $u $p /add /y
          net localgroup Administrators $u /add
          net localgroup 'Remote Desktop Users' $u /add
          Write-Host "[OK] User $u dibuat."

      - name: 3. Wallpaper Putih + Branding
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 1920, 1080
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          $gfx.Clear([System.Drawing.Color]::White)
          $font = New-Object System.Drawing.Font('Segoe UI', 72, [System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(200, 200, 200))
          $text = 'OXZRDP PRO V3.2'
          $size = $gfx.MeasureString($text, $font)
          $gfx.DrawString($text, $font, $brush, (1920 - $size.Width) / 2, (1080 - $size.Height) / 2 - 80)
          $font2 = New-Object System.Drawing.Font('Segoe UI', 28, [System.Drawing.FontStyle]::Regular)
          $text2 = 'By Yannzz and OxzStudios'
          $size2 = $gfx.MeasureString($text2, $font2)
          $gfx.DrawString($text2, $font2, $brush, (1920 - $size2.Width) / 2, (1080 - $size2.Height) / 2 + 60)
          $gfx.Dispose()
          $wallPath = 'C:\Windows\Web\Wallpaper\oxzrdp-white.jpg'
          $bmp.Save($wallPath, [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $bmp.Dispose()
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'Wallpaper' -Value $wallPath -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WallpaperStyle' -Value '10' -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'TileWallpaper' -Value '0' -Force
          Write-Host '[OK] Wallpaper terpasang.'

      - name: 4. Robot Info Desktop
        shell: pwsh
        continue-on-error: true
        run: |
          $toolDir = 'C:\OXZRDP'
          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null

          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256, 256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::White)
          $blue = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(50, 120, 220))
          $white = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::White)
          $black = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::Black)
          $g.FillRectangle($blue, 60, 90, 136, 120)
          $g.FillRectangle($blue, 80, 40, 96, 60)
          $g.FillEllipse($white, 100, 60, 20, 20)
          $g.FillEllipse($white, 136, 60, 20, 20)
          $g.FillEllipse($black, 108, 66, 10, 10)
          $g.FillEllipse($black, 144, 66, 10, 10)
          $g.FillRectangle($black, 110, 82, 36, 6)
          $pen = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(50, 120, 220)), 4
          $g.DrawLine($pen, 128, 40, 128, 15)
          $g.FillEllipse($blue, 120, 5, 16, 16)
          $g.FillRectangle($blue, 30, 110, 25, 80)
          $g.FillRectangle($blue, 201, 110, 25, 80)
          $g.FillRectangle($blue, 80, 215, 40, 30)
          $g.FillRectangle($blue, 136, 215, 40, 30)
          $g.Dispose()
          $pngPath = "$toolDir\robot.png"
          $bmp.Save($pngPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()

          $lines = @()
          $lines += 'Add-Type -AssemblyName PresentationFramework'
          $lines += '$msg = "========================================`n   OXZRDP PRO V3.2 - TENTANG`n========================================`n`n  Versi       : V3.2`n  Developer   : Yannzz dan OxzStudios`n  Platform    : GitHub Actions + Tailscale`n`n========================================`n   FITUR AKTIF V3.2`n========================================`n  - RDP Remote Desktop 24 Jam`n  - Discord Desktop`n  - Chrome Portable`n  - Spotify Desktop`n  - VS Code Portable`n  - VLC Media Player`n  - ShareX Screenshot`n  - Notepad++`n  - System Monitor`n  - Benchmark Tool`n  - Auto-Lock 10 Menit`n  - Auto-Backup Desktop`n  - Dark Mode Toggle`n  - Clipboard Sync`n  - Firewall Hardening`n`n========================================`n   FITUR YANG AKAN DATANG V3.3`n========================================`n  - Support Roblox via Cloud Phone`n  - Panel Kontrol via WhatsApp Bot`n  - Multi-User 4 Sesi`n  - Tailscale Exit Node`n  - Custom Wallpaper User`n  - Auto-Update Workflow`n`n========================================`n   WEBSITE dan COMMUNITY`n========================================`n  Website   : https://oxzratxone-official.netlify.app`n  Community : https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3`n`n========================================`n  (c) 2026 Yannzz dan OxzStudios`n========================================"'
          $lines += '$window = New-Object System.Windows.Window'
          $lines += '$window.Title = "Tentang OXZRDP PRO V3.2"'
          $lines += '$window.Width = 620'
          $lines += '$window.Height = 720'
          $lines += '$window.WindowStartupLocation = "CenterScreen"'
          $lines += '$window.Background = "White"'
          $lines += '$scroll = New-Object System.Windows.Controls.ScrollViewer'
          $lines += '$tb = New-Object System.Windows.Controls.TextBox'
          $lines += '$tb.Text = $msg'
          $lines += '$tb.FontFamily = "Consolas"'
          $lines += '$tb.FontSize = 12'
          $lines += '$tb.IsReadOnly = $true'
          $lines += '$tb.Background = "White"'
          $lines += '$tb.BorderThickness = 0'
          $lines += '$tb.Margin = "10"'
          $lines += '$scroll.Content = $tb'
          $lines += '$window.Content = $scroll'
          $lines += '$window.ShowDialog() | Out-Null'
          $lines -join "`n" | Out-File -FilePath "$toolDir\Tentang-OXZRDP.ps1" -Encoding utf8

          $Shell = New-Object -ComObject WScript.Shell
          $sc = $Shell.CreateShortcut('C:\Users\Public\Desktop\Tentang OXZRDP.lnk')
          $sc.TargetPath = 'powershell.exe'
          $sc.Arguments = "-ExecutionPolicy Bypass -WindowStyle Hidden -File `"$toolDir\Tentang-OXZRDP.ps1`""
          $sc.IconLocation = "$pngPath,0"
          $sc.Save()

          $startMenu = 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Tentang OXZRDP.lnk'
          $sc2 = $Shell.CreateShortcut($startMenu)
          $sc2.TargetPath = 'powershell.exe'
          $sc2.Arguments = "-ExecutionPolicy Bypass -WindowStyle Hidden -File `"$toolDir\Tentang-OXZRDP.ps1`""
          $sc2.IconLocation = "$pngPath,0"
          $sc2.Save()
          Write-Host '[OK] Robot Info terpasang.'

      - name: 5. Optimasi Anti Lag
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @('*Microsoft.Office*','*OneDrive*','*SkypeApp*','*XboxApp*','*BingNews*','*BingWeather*','*GetHelp*','*ZuneMusic*','*ZuneVideo*','*People*','*Maps*','*Todos*')
          foreach ($app in $apps) {
            Get-AppxPackage -Name $app -AllUsers -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue
          }
          $services = @('DiagTrack','dmwappushservice','SysMain','WSearch','MapsBroker','RetailDemo','WMPNetworkSvc')
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name 'NetworkThrottlingIndex' -Value 0xffffffff -Force -ErrorAction SilentlyContinue
          netsh int tcp set global autotuninglevel=normal
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          powercfg -change -monitor-timeout-ac 0
          powercfg -change -standby-timeout-ac 0
          Write-Host '[OK] Optimasi selesai.'

      - name: 6. Install Apps (Discord + Chrome + Spotify + VLC + ShareX)
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @(
            @{id='Discord.Discord'; name='Discord'},
            @{id='Google.Chrome'; name='Chrome'},
            @{id='Spotify.Spotify'; name='Spotify'},
            @{id='VideoLAN.VLC'; name='VLC'},
            @{id='ShareX.ShareX'; name='ShareX'},
            @{id='Notepad++.Notepad++'; name='Notepad++'}
          )
          foreach ($app in $apps) {
            Write-Host "[+] Install $($app.name)..."
            try {
              winget install --id $($app.id) --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            } catch {
              Write-Host "[!] $($app.name) gagal, skip."
            }
          }
          Get-Process Discord -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0
          exit 0

      - name: 7. VS Code Portable
        shell: pwsh
        continue-on-error: true
        run: |
          $toolDir = 'C:\OXZRDP'
          $vscode = "$toolDir\VSCode"
          New-Item -ItemType Directory -Path $vscode -Force | Out-Null
          $url = 'https://code.visualstudio.com/sha/download?build=stable&os=win32-x64-archive'
          $zip = "$env:TEMP\vscode.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $vscode -Force
          $Shell = New-Object -ComObject WScript.Shell
          $sc = $Shell.CreateShortcut('C:\Users\Public\Desktop\VS Code.lnk')
          $sc.TargetPath = "$vscode\Code.exe"
          $sc.Save()
          Write-Host '[OK] VS Code Portable terpasang.'

      - name: 8. Shortcut Desktop
        shell: pwsh
        run: |
          $Desktop = 'C:\Users\Public\Desktop'
          $Shell = New-Object -ComObject WScript.Shell
          $list = @(
            @{n='Vortexzzx-WEB.url'; t='https://oxzratxone-official.netlify.app'},
            @{n='Community WhatsApp.url'; t='https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3'},
            @{n='Spotify Web.url'; t='https://open.spotify.com'},
            @{n='YouTube.url'; t='https://www.youtube.com'},
            @{n='Speed Test.url'; t='https://fast.com'},
            @{n='Netflix.url'; t='https://www.netflix.com'}
          )
          foreach ($item in $list) {
            $sc = $Shell.CreateShortcut("$Desktop\$($item.n)")
            $sc.TargetPath = $item.t
            $sc.Save()
          }
          $scMon = $Shell.CreateShortcut("$Desktop\Task Manager.lnk")
          $scMon.TargetPath = 'taskmgr.exe'
          $scMon.Save()
          Write-Host '[OK] Shortcut dibuat.'

      - name: 9. System Monitor Widget
        shell: pwsh
        continue-on-error: true
        run: |
          $toolDir = 'C:\OXZRDP'
          $lines = @()
          $lines += 'while ($true) {'
          $lines += '  $cpu = (Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average'
          $lines += '  $os = Get-CimInstance Win32_OperatingSystem'
          $lines += '  $ramUsed = [math]::Round((($os.TotalVisibleMemorySize - $os.FreePhysicalMemory) / 1MB), 2)'
          $lines += '  $ramTotal = [math]::Round(($os.TotalVisibleMemorySize / 1MB), 2)'
          $lines += '  $ramPct = [math]::Round(($ramUsed / $ramTotal) * 100, 1)'
          $lines += '  Clear-Host'
          $lines += '  Write-Host "========================================" -ForegroundColor Cyan'
          $lines += '  Write-Host "   OXZRDP PRO V3.2 - SYSTEM MONITOR" -ForegroundColor White'
          $lines += '  Write-Host "========================================" -ForegroundColor Cyan'
          $lines += '  Write-Host ""'
          $lines += '  Write-Host "  CPU Usage  : $cpu %" -ForegroundColor Yellow'
          $lines += '  Write-Host "  RAM Used   : $ramUsed GB / $ramTotal GB" -ForegroundColor Yellow'
          $lines += '  Write-Host "  RAM Percent: $ramPct %" -ForegroundColor Yellow'
          $lines += '  Write-Host ""'
          $lines += '  Write-Host "  Update tiap 5 detik. Ctrl+C untuk keluar." -ForegroundColor Gray'
          $lines += '  Start-Sleep -Seconds 5'
          $lines += '}'
          $lines -join "`n" | Out-File -FilePath "$toolDir\SystemMonitor.ps1" -Encoding utf8
          $Shell = New-Object -ComObject WScript.Shell
          $sc = $Shell.CreateShortcut('C:\Users\Public\Desktop\System Monitor.lnk')
          $sc.TargetPath = 'powershell.exe'
          $sc.Arguments = "-ExecutionPolicy Bypass -File `"$toolDir\SystemMonitor.ps1`""
          $sc.IconLocation = 'C:\Windows\System32\taskmgr.exe,0'
          $sc.Save()
          Write-Host '[OK] System Monitor terpasang.'

      - name: 10. Benchmark Tool
        shell: pwsh
        continue-on-error: true
        run: |
          $toolDir = 'C:\OXZRDP'
          $lines = @()
          $lines += 'Write-Host "===== OXZRDP BENCHMARK =====" -ForegroundColor Cyan'
          $lines += '$cpu = (Get-CimInstance Win32_Processor).Name'
          $lines += '$cores = (Get-CimInstance Win32_Processor).NumberOfCores'
          $lines += '$ram = [math]::Round(((Get-CimInstance Win32_OperatingSystem).TotalVisibleMemorySize / 1MB), 2)'
          $lines += 'Write-Host "CPU: $cpu"'
          $lines += 'Write-Host "Cores: $cores"'
          $lines += 'Write-Host "RAM: $ram GB"'
          $lines += 'Write-Host ""'
          $lines += 'Write-Host "Test CPU..."'
          $lines += '$sw = [System.Diagnostics.Stopwatch]::StartNew()'
          $lines += 'for ($i = 0; $i -lt 1000000; $i++) { $x = $i * 2 }'
          $lines += '$sw.Stop()'
          $lines += 'Write-Host "CPU Score: $($sw.ElapsedMilliseconds) ms"'
          $lines += 'Write-Host ""'
          $lines += 'Write-Host "Test Disk..."'
          $lines += '$sw2 = [System.Diagnostics.Stopwatch]::StartNew()'
          $lines += '$data = New-Object byte[] 10485760'
          $lines += '[System.IO.File]::WriteAllBytes("$env:TEMP\bench.tmp", $data)'
          $lines += '[System.IO.File]::ReadAllBytes("$env:TEMP\bench.tmp") | Out-Null'
          $lines += 'Remove-Item "$env:TEMP\bench.tmp" -Force'
          $lines += '$sw2.Stop()'
          $lines += 'Write-Host "Disk 10MB R/W: $($sw2.ElapsedMilliseconds) ms"'
          $lines += 'Write-Host "===== SELESAI =====" -ForegroundColor Cyan'
          $lines += 'Read-Host "Tekan Enter untuk keluar"'
          $lines -join "`n" | Out-File -FilePath "$toolDir\Benchmark.ps1" -Encoding utf8
          $Shell = New-Object -ComObject WScript.Shell
          $sc = $Shell.CreateShortcut('C:\Users\Public\Desktop\Benchmark.lnk')
          $sc.TargetPath = 'powershell.exe'
          $sc.Arguments = "-ExecutionPolicy Bypass -NoExit -File `"$toolDir\Benchmark.ps1`""
          $sc.IconLocation = 'C:\Windows\System32\perfmon.exe,0'
          $sc.Save()
          Write-Host '[OK] Benchmark terpasang.'

      - name: 11. Auto-Lock 10 Menit
        shell: pwsh
        continue-on-error: true
        run: |
          powercfg -change -monitor-timeout-ac 10
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'ScreenSaveActive' -Value '1' -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'ScreenSaveTimeOut' -Value '600' -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'ScreenSaverIsSecure' -Value '1' -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'SCRNSAVE.EXE' -Value 'C:\Windows\System32\scrnsave.scr' -Force
          Write-Host '[OK] Auto-Lock 10 menit aktif.'

      - name: 12. Dark Mode Toggle
        shell: pwsh
        continue-on-error: true
        run: |
          $toolDir = 'C:\OXZRDP'
          $lines = @()
          $lines += '$cur = Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name AppsUseLightTheme -ErrorAction SilentlyContinue'
          $lines += 'if ($cur.AppsUseLightTheme -eq 1) {'
          $lines += '  Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name AppsUseLightTheme -Value 0 -Force'
          $lines += '  Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name SystemUsesLightTheme -Value 0 -Force'
          $lines += '  Write-Host "Dark Mode ON" -ForegroundColor Yellow'
          $lines += '} else {'
          $lines += '  Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name AppsUseLightTheme -Value 1 -Force'
          $lines += '  Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name SystemUsesLightTheme -Value 1 -Force'
          $lines += '  Write-Host "Light Mode ON" -ForegroundColor Cyan'
          $lines += '}'
          $lines += 'Start-Sleep -Seconds 2'
          $lines -join "`n" | Out-File -FilePath "$toolDir\DarkModeToggle.ps1" -Encoding utf8
          $Shell = New-Object -ComObject WScript.Shell
          $sc = $Shell.CreateShortcut('C:\Users\Public\Desktop\Dark Mode Toggle.lnk')
          $sc.TargetPath = 'powershell.exe'
          $sc.Arguments = "-ExecutionPolicy Bypass -WindowStyle Hidden -File `"$toolDir\DarkModeToggle.ps1`""
          $sc.IconLocation = 'C:\Windows\System32\shell32.dll,72'
          $sc.Save()
          Write-Host '[OK] Dark Mode Toggle terpasang.'

      - name: 13. Auto-Backup Desktop
        shell: pwsh
        continue-on-error: true
        run: |
          $backupDir = 'C:\Users\Public\Documents\OXZRDP-Backup'
          New-Item -ItemType Directory -Path $backupDir -Force | Out-Null
          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-Command Copy-Item 'C:\Users\Public\Desktop\*' -Destination '$backupDir' -Recurse -Force -ErrorAction SilentlyContinue"
          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(5) -RepetitionInterval (New-TimeSpan -Hours 1)
          Register-ScheduledTask -TaskName 'OXZRDP-Backup' -Action $action -Trigger $trigger -RunLevel Highest -Force | Out-Null
          Write-Host '[OK] Auto-Backup Desktop aktif (tiap 1 jam).'

      - name: 14. Firewall Hardening
        shell: pwsh
        continue-on-error: true
        run: |
          $ports = @(135, 137, 138, 139, 445, 1433, 3306, 5900)
          foreach ($port in $ports) {
            New-NetFirewallRule -DisplayName "Block Port $port" -Direction Inbound -Protocol TCP -LocalPort $port -Action Block -ErrorAction SilentlyContinue | Out-Null
          }
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          Write-Host '[OK] Firewall hardening selesai.'

      - name: 15. Tailscale Tunneling
        shell: pwsh
        run: |
    
