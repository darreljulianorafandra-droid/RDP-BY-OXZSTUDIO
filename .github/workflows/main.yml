          $changelog += '==============================================='
          
          $changelog -join "`n" | Out-File -FilePath 'C:\Users\Public\Desktop\CHANGELOG.txt' -Encoding utf8
          $changelog -join "`n" | Out-File -FilePath 'C:\Users\Public\Documents\OXZRDP-CHANGELOG.txt' -Encoding utf8
          Write-Host '[OK] Changelog dibuat di Desktop.'

      # ============ STEP 6 - INSTALL APPS ============
      - name: 6. Install Apps
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @(
            @{id='Discord.Discord'; name='Discord'},
            @{id='Google.Chrome'; name='Chrome'},
            @{id='Spotify.Spotify'; name='Spotify'},
            @{id='VideoLAN.VLC'; name='VLC'},
            @{id='Notepad++.Notepad++'; name='Notepad++'},
            @{id='WhatsApp.WhatsApp'; name='WhatsApp'}
          )
          foreach ($app in $apps) {
            Write-Host "[+] Install $($app.name)..."
            try {
              winget install --id $($app.id) --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            } catch { }
          }
          Get-Process Discord -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0
          exit 0

      # ============ STEP 7 - ROBOT INFO ============
      - name: 7. Robot Info
        shell: pwsh
        continue-on-error: true
        run: |
          $toolDir = 'C:\OXZRDP'
          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null
          Add-Type -AssemblyName System.Drawing
          $ico = New-Object System.Drawing.Bitmap 256, 256
          $g = [System.Drawing.Graphics]::FromImage($ico)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::White)
          $blue = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(50, 120, 220))
          $white = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::White)
          $black = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::Black)
          $g.FillRectangle($blue, 60, 90, 136, 120)
          $g.FillRectangle($blue, 80, 40, 96, 60)
          $g.FillEllipse($white, 100, 60, 20, 20)
          $g.FillEllipse($white, 136, 60, 20, 20)
          $g.FillEllipse($black, 108, 66, 10, 10)
          $g.FillEllipse($black, 144, 66, 10, 10)
          $g.FillRectangle($black, 110, 82, 36, 6)
          $pen = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(50, 120, 220)), 4
          $g.DrawLine($pen, 128, 40, 128, 15)
          $g.FillEllipse($blue, 120, 5, 16, 16)
          $g.FillRectangle($blue, 30, 110, 25, 80)
          $g.FillRectangle($blue, 201, 110, 25, 80)
          $g.FillRectangle($blue, 80, 215, 40, 30)
          $g.FillRectangle($blue, 136, 215, 40, 30)
          $g.Dispose()
          $pngPath = "$toolDir\robot.png"
          $ico.Save($pngPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $ico.Dispose()
          
          $infoPath = "$toolDir\Tentang-OXZRDP.ps1"
          $lines = @()
          $lines += 'Add-Type -AssemblyName PresentationFramework'
          $lines += '$msg = "========================================`n   OXZRDP PRO V4.1 - TENTANG`n========================================`n`n  Versi     : V4.1`n  Developer : Yannzz dan OxzStudios`n  Platform  : GitHub Actions + Tailscale`n`n========================================`n   FITUR AKTIF V4.1`n========================================`n  - Play Store Helper + Shortcut`n  - Theme Market (5 tema)`n  - Changelog`n  - RDP Remote Desktop 24 Jam`n  - Discord, Chrome, Spotify, VLC`n  - WhatsApp Desktop`n  - Notepad++`n  - System Monitor, Benchmark`n  - Dark Mode Toggle`n  - Auto-Lock + Auto-Backup`n  - Wallpaper dari URL`n  - Windows Update Aktif`n  - Device Rename Otomatis`n`n========================================`n   WEBSITE dan COMMUNITY`n========================================`n  Website   : https://oxzratxone-official.netlify.app`n  Community : https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3`n`n========================================`n  (c) 2026 Yannzz dan OxzStudios`n========================================"'
          $lines += '$window = New-Object System.Windows.Window'
          $lines += '$window.Title = "Tentang OXZRDP PRO V4.1"'
          $lines += '$window.Width = 650'
          $lines += '$window.Height = 720'
          $lines += '$window.WindowStartupLocation = "CenterScreen"'
          $lines += '$window.Background = "White"'
          $lines += '$scroll = New-Object System.Windows.Controls.ScrollViewer'
          $lines += '$tb = New-Object System.Windows.Controls.TextBox'
          $lines += '$tb.Text = $msg'
          $lines += '$tb.FontFamily = "Consolas"'
          $lines += '$tb.FontSize = 12'
          $lines += '$tb.IsReadOnly = $true'
          $lines += '$tb.Background = "White"'
          $lines += '$tb.BorderThickness = 0'
          $lines += '$tb.Margin = "10"'
          $lines += '$scroll.Content = $tb'
          $lines += '$window.Content = $scroll'
          $lines += '$window.ShowDialog() | Out-Null'
          $lines -join "`n" | Out-File -FilePath $infoPath -Encoding utf8
          
          $Shell = New-Object -ComObject WScript.Shell
          $sc = $Shell.CreateShortcut('C:\Users\Public\Desktop\Tentang OXZRDP.lnk')
          $sc.TargetPath = 'powershell.exe'
          $sc.Arguments = "-ExecutionPolicy Bypass -WindowStyle Hidden -File `"$infoPath`""
          $sc.IconLocation = "$pngPath,0"
          $sc.Save()
          Write-Host '[OK] Robot Info terpasang.'

      # ============ STEP 8 - SHORTCUT + TOOLS ============
      - name: 8. Shortcut + Tools
        shell: pwsh
        continue-on-error: true
        run: |
          $Desktop = 'C:\Users\Public\Desktop'
          $Shell = New-Object -ComObject WScript.Shell
          $list = @(
            @{n='Vortexzzx-WEB.url'; t='https://oxzratxone-official.netlify.app'},
            @{n='Community WhatsApp.url'; t='https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3'},
            @{n='Spotify Web.url'; t='https://open.spotify.com'},
            @{n='YouTube.url'; t='https://www.youtube.com'},
            @{n='Speed Test.url'; t='https://fast.com'},
            @{n='Windows Update.url'; t='ms-settings:windowsupdate'}
          )
          foreach ($item in $list) {
            $s = $Shell.CreateShortcut("$Desktop\$($item.n)")
            $s.TargetPath = $item.t
            $s.Save()
          }
          $scMon = $Shell.CreateShortcut("$Desktop\Task Manager.lnk")
          $scMon.TargetPath = 'taskmgr.exe'
          $scMon.Save()
          
          # System Monitor
          $l1 = @()
          $l1 += 'while ($true) {'
          $l1 += '  $cpu = (Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average'
          $l1 += '  $os = Get-CimInstance Win32_OperatingSystem'
          $l1 += '  $ramUsed = [math]::Round((($os.TotalVisibleMemorySize - $os.FreePhysicalMemory) / 1MB), 2)'
          $l1 += '  $ramTotal = [math]::Round(($os.TotalVisibleMemorySize / 1MB), 2)'
          $l1 += '  Clear-Host'
          $l1 += '  Write-Host "=== OXZRDP V4.1 SYSTEM MONITOR ===" -ForegroundColor Cyan'
          $l1 += '  Write-Host "CPU: $cpu %" -ForegroundColor Yellow'
          $l1 += '  Write-Host "RAM: $ramUsed GB / $ramTotal GB" -ForegroundColor Yellow'
          $l1 += '  Start-Sleep -Seconds 5'
          $l1 += '}'
          $l1 -join "`n" | Out-File -FilePath 'C:\OXZRDP\SystemMonitor.ps1' -Encoding utf8
          $sc = $Shell.CreateShortcut('C:\Users\Public\Desktop\System Monitor.lnk')
          $sc.TargetPath = 'powershell.exe'
          $sc.Arguments = "-ExecutionPolicy Bypass -File `"C:\OXZRDP\SystemMonitor.ps1`""
          $sc.Save()
          
          Write-Host '[OK] Shortcut + Tools terpasang.'

      # ============ STEP 9 - TAILSCALE + INFO + KEEP ALIVE ============
      - name: 9. Tailscale + Info Akses + Keep Alive
        shell: pwsh
        run: |
          $ip = 'TAILSCALE-GAGAL'
          try {
            Write-Host '[+] Setup Tailscale...'
            $msi = "$env:TEMP\ts.msi"
            Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' -OutFile $msi
            Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait
            
            $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
            if (Test-Path $tsExe) {
              $hostname = "OXZRDP-PRO-$((Get-Random -Min 100 -Max 999))"
              & $tsExe up --authkey=${{ secrets.OXZ_KEY }} --hostname=$hostname --accept-routes 2>&1 | Write-Host
              
              for ($i = 1; $i -le 12; $i++) {
                Start-Sleep -Seconds 5
                $ipCheck = & $tsExe ip -4 2>$null
                if (-not [string]::IsNullOrWhiteSpace($ipCheck)) {
                  $ip = $ipCheck
                  break
                }
              }
            }
          } catch {
            Write-Host "[!] Tailscale error: $($_.Exception.Message)"
          }
          
          Write-Host "`n==============================================="
          Write-Host " [ OXZRDP PRO V4.1 - ONLINE ]"
          Write-Host "==============================================="
          Write-Host " IP ADDRESS : $ip"
          Write-Host " USERNAME   : $env:OXZRDP_USER"
          Write-Host " PASSWORD   : $env:OXZRDP_PASS"
          Write-Host " DURASI     : 1 HARI (STEALTH)"
