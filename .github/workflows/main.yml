name: OXZRDP-PRO-1HARI

on:
  workflow_dispatch:

jobs:
  deployment:
    runs-on: windows-latest
    timeout-minutes: 1440

    steps:
      - name: 1. Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force
          netsh advfirewall firewall set rule group='remote desktop' new enable=Yes
          Restart-Service -Name TermService -Force

      - name: 2. Bikin User Random
        shell: pwsh
        run: |
          $id = Get-Random -Minimum 1000 -Maximum 9999
          $u = "UserOxz$id"
          $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789')
          $p = ''
          foreach ($s in $sets) { $p += $s[(Get-Random -Maximum $s.Length)] }
          $all = -join $sets
          for ($i = 1; $i -le 11; $i++) { $p += $all[(Get-Random -Maximum $all.Length)] }
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_USER=$u"
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_PASS=$p"
          net user $u $p /add /y
          net localgroup Administrators $u /add

      - name: 3. Wallpaper Putih Polos
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 1920, 1080
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          $gfx.Clear([System.Drawing.Color]::White)
          $font = New-Object System.Drawing.Font('Segoe UI', 72, [System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(200, 200, 200))
          $text = 'OXZRDP PRO'
          $size = $gfx.MeasureString($text, $font)
          $gfx.DrawString($text, $font, $brush, (1920 - $size.Width) / 2, (1080 - $size.Height) / 2 - 80)
          $font2 = New-Object System.Drawing.Font('Segoe UI', 28, [System.Drawing.FontStyle]::Regular)
          $text2 = 'By Yannzz and OxzStudios'
          $size2 = $gfx.MeasureString($text2, $font2)
          $gfx.DrawString($text2, $font2, $brush, (1920 - $size2.Width) / 2, (1080 - $size2.Height) / 2 + 60)
          $gfx.Dispose()
          $wallPath = 'C:\Windows\Web\Wallpaper\oxzrdp-white.jpg'
          $bmp.Save($wallPath, [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $bmp.Dispose()
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'Wallpaper' -Value $wallPath -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WallpaperStyle' -Value '10' -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'TileWallpaper' -Value '0' -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Colors' -Name 'Background' -Value '255 255 255' -Force

      - name: 4. Optimasi Anti Lag
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @('*Microsoft.Office*','*OneDrive*','*SkypeApp*','*XboxApp*','*BingNews*','*BingWeather*','*GetHelp*','*ZuneMusic*','*ZuneVideo*','*People*','*Maps*','*Todos*')
          foreach ($app in $apps) {
            Get-AppxPackage -Name $app -AllUsers -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue
          }
          $services = @('DiagTrack','dmwappushservice','SysMain','WSearch','MapsBroker','RetailDemo','WMPNetworkSvc')
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name 'NetworkThrottlingIndex' -Value 0xffffffff -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name 'SystemResponsiveness' -Value 0 -Force -ErrorAction SilentlyContinue
          netsh int tcp set global autotuninglevel=normal
          netsh int tcp set global rss=enabled
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          powercfg -change -monitor-timeout-ac 0
          powercfg -change -standby-timeout-ac 0

      - name: 5. Install Discord
        shell: pwsh
        continue-on-error: true
        run: |
          winget install --id Discord.Discord --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if (-not (Test-Path "$env:LOCALAPPDATA\Discord\Update.exe")) {
            $d = "$env:TEMP\DiscordSetup.exe"
            Invoke-WebRequest -Uri 'https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64' -OutFile $d -UseBasicParsing
            Start-Process $d -ArgumentList '-s' -Wait
          }
          Get-Process Discord -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0
          exit 0

      - name: 6. Shortcut dan Branding
        shell: pwsh
        run: |
          $Desktop = 'C:\Users\Public\Desktop'
          $Shell = New-Object -ComObject WScript.Shell
          $s1 = $Shell.CreateShortcut("$Desktop\Vortexzzx-WEB.url")
          $s1.TargetPath = 'https://oxzratxone-official.netlify.app'
          $s1.Save()
          $s2 = $Shell.CreateShortcut("$Desktop\Gabung Community WhatsApp.url")
          $s2.TargetPath = 'https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3'
          $s2.Save()
          $info = @()
          $info += '==========================================='
          $info += '   OXZRDP PRO - By Yannzz dan OxzStudios'
          $info += '==========================================='
          $info += '   Discord Ready - Anti Lag'
          $info += '==========================================='
          $info += 'Website   : https://oxzratxone-official.netlify.app'
          $info += 'Community : https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3'
          $info += '==========================================='
          $info += ''
          $info += 'CATATAN:'
          $info += '- Roblox Player tidak support di VM.'
          $info += '- Main Roblox di PC fisik.'
          $info += ''
          $info += '==========================================='
          $info += '[ FITUR YANG AKAN DATANG ]'
          $info += '==========================================='
          $info += '- Support Roblox via Cloud Gaming beta'
          $info += '- Auto-install Chrome dan Spotify'
          $info += '- Panel kontrol via WhatsApp Bot'
          $info += '- Wallpaper custom dari user'
          $info += '- Tailscale Exit Node'
          $info += '- Fitur baru menyusul di Community'
          $info += '==========================================='
          $info | Out-File -FilePath "$Desktop\README.txt" -Encoding utf8
          $info | Out-File -FilePath 'C:\Users\Public\Documents\OXZRDP-INFO.txt' -Encoding utf8

      - name: 7. Tailscale Tunneling
        shell: pwsh
        run: |
          $msi = "$env:TEMP\ts.msi"
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' -OutFile $msi
          Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait
          $hostname = "OXZRDP-PRO-$((Get-Random -Min 100 -Max 999))"
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.OXZ_KEY }} --hostname=$hostname --accept-routes
          Start-Sleep -Seconds 10
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=$ip"

      - name: 8. Info Akses dan Keep Alive
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '==============================================='
          Write-Host '  OXZRDP PRO - ONLINE'
          Write-Host '  By Yannzz dan OxzStudios'
          Write-Host '==============================================='
          Write-Host "  IP ADDRESS : $env:OXZRDP_IP"
          Write-Host "  USERNAME   : $env:OXZRDP_USER"
          Write-Host "  PASSWORD   : $env:OXZRDP_PASS"
          Write-Host '  DURASI     : 1 HARI'
          Write-Host '  STATUS     : Discord Ready'
          Write-Host '  ROBLOX     : TIDAK SUPPORT DI VM'
          Write-Host '==============================================='
          Write-Host '  Website   : https://oxzratxone-official.netlify.app'
          Write-Host '  Community : https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3'
          Write-Host '==============================================='
          $endTime = (Get-Date).AddMinutes(1435)
          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Online Sisa: $($remaining.ToString('hh\:mm\:ss'))"
            Start-Sleep -Seconds 300
          }
