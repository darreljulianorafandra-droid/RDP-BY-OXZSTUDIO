name: OXZRDP-PRO-V4.1

on:
  workflow_dispatch:

jobs:
  deployment:
    runs-on: windows-latest
    timeout-minutes: 1440

    steps:
      # ============ STEP 1 - ENABLE RDP + RENAME DEVICE ============
      - name: 1. Enable RDP + Rename Device
        shell: pwsh
        continue-on-error: true
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          netsh advfirewall firewall set rule group='remote desktop' new enable=Yes
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
          $newName = "OXZRDP-PRO-$((Get-Random -Min 100 -Max 999))"
          Rename-Computer -NewName $newName -Force -ErrorAction SilentlyContinue
          Write-Host "[OK] Device renamed: $newName"

      # ============ STEP 2 - BIKIN USER + WINDOWS UPDATE ============
      - name: 2. Bikin User + Enable Windows Update
        shell: pwsh
        continue-on-error: true
        run: |
          $id = Get-Random -Minimum 1000 -Maximum 9999
          $u = "UserOxz$id"
          $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789')
          $p = ''
          foreach ($s in $sets) { $p += $s[(Get-Random -Maximum $s.Length)] }
          $all = -join $sets
          for ($i = 1; $i -le 11; $i++) { $p += $all[(Get-Random -Maximum $all.Length)] }
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_USER=$u"
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_PASS=$p"
          net user $u $p /add /y
          net localgroup Administrators $u /add
          net localgroup 'Remote Desktop Users' $u /add
          Set-Service -Name wuauserv -StartupType Automatic -ErrorAction SilentlyContinue
          Set-Service -Name UsoSvc -StartupType Automatic -ErrorAction SilentlyContinue
          Set-Service -Name BITS -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name wuauserv -ErrorAction SilentlyContinue
          Start-Service -Name UsoSvc -ErrorAction SilentlyContinue
          Start-Service -Name BITS -ErrorAction SilentlyContinue
          Write-Host "[OK] User $u dibuat."

      # ============ STEP 3 - WALLPAPER + THEME MARKET ============
      - name: 3. Wallpaper + Theme Market
        shell: pwsh
        continue-on-error: true
        run: |
          $themeDir = 'C:\OXZRDP\Themes'
          New-Item -ItemType Directory -Path $themeDir -Force | Out-Null
          
          # Wallpaper utama dari URL
          $wallPath = 'C:\Windows\Web\Wallpaper\oxzrdp.jpg'
          $wallUrl = 'https://files.catbox.moe/yfz3h8.jpg'
          $ok = $false
          try {
            Invoke-WebRequest -Uri $wallUrl -OutFile $wallPath -UseBasicParsing -TimeoutSec 60
            if ((Get-Item $wallPath).Length -gt 10000) { $ok = $true }
          } catch { }
          
          if (-not $ok) {
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap 1920, 1080
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.Clear([System.Drawing.Color]::White)
            $gfx.Dispose()
            $bmp.Save($wallPath, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            $bmp.Dispose()
          }
          
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'Wallpaper' -Value $wallPath -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WallpaperStyle' -Value '10' -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'TileWallpaper' -Value '0' -Force
          
          # === THEME MARKET ===
          Write-Host '[+] Bikin Theme Market...'
          
          # Download beberapa wallpaper tema
          $themes = @(
            @{name='Dark-Abstract'; url='https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1920'},
            @{name='Blue-Gradient'; url='https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=1920'},
            @{name='Nature-Forest'; url='https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920'},
            @{name='Tech-Circuit'; url='https://images.unsplash.com/photo-1518770660439-4636190af475?w=1920'},
            @{name='Space-Galaxy'; url='https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920'}
          )
          
          foreach ($theme in $themes) {
            try {
              $out = "$themeDir\$($theme.name).jpg"
              Invoke-WebRequest -Uri $theme.url -OutFile $out -UseBasicParsing -TimeoutSec 30
              Write-Host "[OK] Tema $($theme.name) terdownload."
            } catch {
              Write-Host "[!] Tema $($theme.name) gagal."
            }
          }
          
          # Script Theme Market
          $tmScript = @'
Add-Type -AssemblyName System.Windows.Forms
Add-Type -AssemblyName System.Drawing

$themeDir = 'C:\OXZRDP\Themes'
$themes = Get-ChildItem -Path $themeDir -Filter '*.jpg' -ErrorAction SilentlyContinue

$form = New-Object System.Windows.Forms.Form
$form.Text = "OXZRDP PRO V4.1 - Theme Market"
$form.Size = New-Object System.Drawing.Size(700, 500)
$form.StartPosition = 'CenterScreen'
$form.BackColor = [System.Drawing.Color]::White

$label = New-Object System.Windows.Forms.Label
$label.Text = "PILIH TEMA WALLPAPER:"
$label.Font = New-Object System.Drawing.Font('Segoe UI', 14, [System.Drawing.FontStyle]::Bold)
$label.Location = New-Object System.Drawing.Point(20, 20)
$label.Size = New-Object System.Drawing.Size(400, 30)
$form.Controls.Add($label)

$listBox = New-Object System.Windows.Forms.ListBox
$listBox.Location = New-Object System.Drawing.Point(20, 60)
$listBox.Size = New-Object System.Drawing.Size(640, 300)
$listBox.Font = New-Object System.Drawing.Font('Segoe UI', 12)

foreach ($t in $themes) {
    [void]$listBox.Items.Add($t.Name)
}
$form.Controls.Add($listBox)

$btn = New-Object System.Windows.Forms.Button
$btn.Text = "Terapkan Tema"
$btn.Location = New-Object System.Drawing.Point(20, 380)
$btn.Size = New-Object System.Drawing.Size(200, 40)
$btn.Font = New-Object System.Drawing.Font('Segoe UI', 12, [System.Drawing.FontStyle]::Bold)
$btn.BackColor = [System.Drawing.Color]::FromArgb(50, 120, 220)
$btn.ForeColor = [System.Drawing.Color]::White
$btn.Add_Click({
    if ($listBox.SelectedItem) {
        $selected = "$themeDir\$($listBox.SelectedItem)"
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'Wallpaper' -Value $selected -Force
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WallpaperStyle' -Value '10' -Force
        [System.Windows.Forms.MessageBox]::Show("Tema diterapkan: $($listBox.SelectedItem)", "OXZRDP Theme Market")
        # Refresh
        Add-Type -TypeDefinition @"
using System;
using System.Runtime.InteropServices;
public class W {
  [DllImport("user32.dll")]
  public static extern int SystemParametersInfo(int a, int b, string c, int d);
}
"@
        [W]::SystemParametersInfo(20, 0, $selected, 3)
    }
})
$form.Controls.Add($btn)

$btnRefresh = New-Object System.Windows.Forms.Button
$btnRefresh.Text = "Refresh"
$btnRefresh.Location = New-Object System.Drawing.Point(240, 380)
$btnRefresh.Size = New-Object System.Drawing.Size(120, 40)
$btnRefresh.Font = New-Object System.Drawing.Font('Segoe UI', 12)
$btnRefresh.Add_Click({
    $listBox.Items.Clear()
    $newThemes = Get-ChildItem -Path $themeDir -Filter '*.jpg' -ErrorAction SilentlyContinue
    foreach ($t in $newThemes) { [void]$listBox.Items.Add($t.Name) }
})
$form.Controls.Add($btnRefresh)

$form.ShowDialog() | Out-Null
'@
          $tmScript | Out-File -FilePath 'C:\OXZRDP\ThemeMarket.ps1' -Encoding utf8
          
          $Shell = New-Object -ComObject WScript.Shell
          $sc = $Shell.CreateShortcut('C:\Users\Public\Desktop\Theme Market.lnk')
          $sc.TargetPath = 'powershell.exe'
          $sc.Arguments = "-ExecutionPolicy Bypass -WindowStyle Hidden -File `"C:\OXZRDP\ThemeMarket.ps1`""
          $sc.IconLocation = 'C:\Windows\System32\imageres.dll,68'
          $sc.Save()
          
          Write-Host '[OK] Theme Market terpasang.'

      # ============ STEP 4 - PLAY STORE DI WINDOWS ============
      - name: 4. Play Store di Windows (WSA)
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host '[+] Setup Play Store untuk Windows...'
          Write-Host '[!] Catatan: WSA hanya support Windows 11. Di Windows Server, install manual.'
          
          # Bikin shortcut ke Play Store web (alternatif)
          $Shell = New-Object -ComObject WScript.Shell
          
          # Shortcut Play Store Web
          $sc1 = $Shell.CreateShortcut('C:\Users\Public\Desktop\Play Store.url')
          $sc1.TargetPath = 'https://play.google.com/store'
          $sc1.Save()
          
          # Shortcut Amazon Appstore (WSA support)
          $sc2 = $Shell.CreateShortcut('C:\Users\Public\Desktop\Amazon Appstore.url')
          $sc2.TargetPath = 'https://www.amazon.com/appstore'
          $sc2.Save()
          
          # Shortcut APK Downloader
          $sc3 = $Shell.CreateShortcut('C:\Users\Public\Desktop\APK Downloader.url')
          $sc3.TargetPath = 'https://apkpure.com'
          $sc3.Save()
          
          # Bikin script Play Store helper
          $psScript = @'
Add-Type -AssemblyName System.Windows.Forms
$msg = @"
============================================
   PLAY STORE DI WINDOWS - OXZRDP V4.1
============================================

  CARA INSTALL PLAY STORE:

  OPSI 1 - WSA (Windows Subsystem for Android):
  ------------------------------------------
  1. Buka Microsoft Store
  2. Cari "Amazon Appstore"
  3. Install
  4. Amazon Appstore include WSA
  5. Setelah install, bisa sideload APK
  
  OPSI 2 - BlueStacks (RECOMMENDED):
  ------------------------------------------
  1. Download BlueStacks dari bluestacks.com
  2. Install
  3. BlueStacks sudah include Play Store
  4. Login Google Account
  5. Download app dari Play Store
  
  OPSI 3 - LDPlayer:
  ------------------------------------------
  1. Download LDPlayer dari ldplayer.net
  2. Install
  3. Include Play Store
  
  OPSI 4 - Play Store Web:
  ------------------------------------------
  1. Buka play.google.com/store
  2. Browse app
  3. Download APK via APKPure
  4. Install manual

============================================
  CATATAN:
  - Windows Server (GitHub Actions) mungkin
    gak support WSA karena butuh Windows 11
  - BlueStacks/LDPlayer bisa install manual
  - Untuk main Roblox: TIDAK SUPPORT di VM

============================================
"@
[System.Windows.Forms.MessageBox]::Show($msg, "Play Store - OXZRDP V4.1")
'@
          $psScript | Out-File -FilePath 'C:\OXZRDP\PlayStoreHelper.ps1' -Encoding utf8
          
          $sc4 = $Shell.CreateShortcut('C:\Users\Public\Desktop\Play Store Helper.lnk')
          $sc4.TargetPath = 'powershell.exe'
          $sc4.Arguments = "-ExecutionPolicy Bypass -WindowStyle Hidden -File `"C:\OXZRDP\PlayStoreHelper.ps1`""
          $sc4.IconLocation = 'C:\Windows\System32\shell32.dll,13'
          $sc4.Save()
          
          # Coba install BlueStacks via winget (kalau ada)
          try {
            winget install --id BlueStack.BlueStacks --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Out-Null
            Write-Host '[OK] BlueStacks terinstall (kalau tersedia).'
          } catch {
            Write-Host '[!] BlueStacks gak tersedia via winget, install manual.'
          }
          
          Write-Host '[OK] Play Store helper terpasang.'

      # ============ STEP 5 - CHANGELOG ============
      - name: 5. Changelog
        shell: pwsh
        continue-on-error: true
        run: |
          $changelog = @()
          $changelog += '==============================================='
          $changelog += '   OXZRDP PRO - CHANGELOG'
          $changelog += '   By Yannzz dan OxzStudios'
          $changelog += '==============================================='
          $changelog += ''
          $changelog += '==============================================='
          $changelog += 'V4.1 (Sekarang) - RELEASE'
          $changelog += '==============================================='
          $changelog += '[+] Play Store di Windows (helper + shortcut)'
          $changelog += '[+] Theme Market (5 tema wallpaper)'
          $changelog += '[+] Changelog file'
          $changelog += '[+] Optimasi Tailscale lebih stabil'
          $changelog += '[+] WhatsApp Desktop (auto install)'
          $changelog += '[+] Fix bug dari V3.2'
          $changelog += ''
          $changelog += '==============================================='
          $changelog += 'V3.2 - STABLE'
          $changelog += '==============================================='
          $changelog += '[+] Wallpaper dari URL'
          $changelog += '[+] Windows Update aktif'
          $changelog += '[+] Rename device otomatis'
          $changelog += '[+] Robot Info Desktop'
          $changelog += '[+] Discord, Chrome, Spotify, VLC, Notepad++'
          $changelog += '[+] System Monitor'
          $changelog += '[+] Benchmark Tool'
          $changelog += '[+] Dark Mode Toggle'
          $changelog += '[+] Auto-Lock 10 menit'
          $changelog += '[+] Auto-Backup Desktop'
          $changelog += '[+] Firewall Hardening'
          $changelog += ''
          $changelog += '==============================================='
          $changelog += 'V3.1 - STABLE'
          $changelog += '==============================================='
          $changelog += '[+] Robot Info di taskbar'
          $changelog += '[+] Wallpaper putih polos'
          $changelog += '[+] Optimasi anti lag'
          $changelog += '[+] Info Akses format baru'
          $changelog += ''
          $changelog += '==============================================='
          $changelog += 'V1.0 - AWAL'
          $changelog += '==============================================='
          $changelog += '[+] RDP basic'
          $changelog += '[+] Tailscale tunneling'
          $changelog += '[+] Info akses'
          $changelog += ''
