name: OXZRDP-V10

on:
  workflow_dispatch:

jobs:
  deployment:
    runs-on: windows-latest
    timeout-minutes: 1440

    steps:
      # ============ STEP 1 - RDP + RENAME PC ============
      - name: 1. Enable RDP + Rename PC
        shell: pwsh
        continue-on-error: true
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          netsh advfirewall firewall set rule group='remote desktop' new enable=Yes
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
          
          $pcName = "OXZRDP-V10-$((Get-Random -Min 100 -Max 999))"
          Rename-Computer -NewName $pcName -Force -ErrorAction SilentlyContinue
          
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "[OK] Nama PC: $pcName"
          Write-Host "[INFO] OS: $($os.Caption)"
          Write-Host "[INFO] RAM: $([math]::Round($os.TotalVisibleMemorySize / 1MB, 2)) GB"

      # ============ STEP 2 - BIKIN USER ============
      - name: 2. Bikin User
        shell: pwsh
        continue-on-error: true
        run: |
          $id = Get-Random -Minimum 1000 -Maximum 9999
          $u = "Yannzz$id"
          $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789')
          $p = ''
          foreach ($s in $sets) { $p += $s[(Get-Random -Maximum $s.Length)] }
          $all = -join $sets
          for ($i = 1; $i -le 11; $i++) { $p += $all[(Get-Random -Maximum $all.Length)] }
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_USER=$u"
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_PASS=$p"
          net user $u $p /add /y
          net localgroup Administrators $u /add
          net localgroup 'Remote Desktop Users' $u /add
          Write-Host "[OK] User: $u"

      # ============ STEP 3 - WALLPAPER + TAMPILAN WIN11 ============
      - name: 3. Wallpaper + Tampilan Mirip Windows 11
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Invoke-WebRequest -Uri 'https://files.catbox.moe/yfz3h8.jpg' -OutFile 'C:\Windows\Web\Wallpaper\oxzrdp.jpg' -UseBasicParsing -TimeoutSec 60
            Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'Wallpaper' -Value 'C:\Windows\Web\Wallpaper\oxzrdp.jpg' -Force
            Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WallpaperStyle' -Value '10' -Force
            Write-Host '[OK] Wallpaper'
          } catch { Write-Host '[!] Wallpaper gagal' }
          
          $adv = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
          Set-ItemProperty -Path $adv -Name 'TaskbarAl' -Value 1 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $adv -Name 'TaskbarSi' -Value 1 -Force -ErrorAction SilentlyContinue
          
          $theme = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          Set-ItemProperty -Path $theme -Name 'AppsUseLightTheme' -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $theme -Name 'SystemUsesLightTheme' -Value 0 -Force -ErrorAction SilentlyContinue
          
          $dwm = 'HKCU:\Software\Microsoft\Windows\DWM'
          Set-ItemProperty -Path $dwm -Name 'ColorizationColor' -Value 0xC40078D7 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $dwm -Name 'ColorPrevalence' -Value 1 -Force -ErrorAction SilentlyContinue
          
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Write-Host '[OK] Tampilan mirip Windows 11 aktif'

      # ============ STEP 4 - OPTIMASI ============
      - name: 4. Optimasi Anti Lag
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @('*Microsoft.Office*','*OneDrive*','*SkypeApp*','*XboxApp*','*BingNews*','*BingWeather*','*GetHelp*','*ZuneMusic*','*ZuneVideo*','*People*','*Maps*','*Todos*')
          foreach ($app in $apps) {
            Get-AppxPackage -Name $app -AllUsers -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue
          }
          $services = @('DiagTrack','dmwappushservice','SysMain','MapsBroker','RetailDemo','WMPNetworkSvc')
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name 'NetworkThrottlingIndex' -Value 0xffffffff -Force -ErrorAction SilentlyContinue
          netsh int tcp set global autotuninglevel=normal
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          Write-Host '[OK] Optimasi selesai'

      # ============ STEP 5 - INSTALL APP + GAME RINGAN ============
      - name: 5. Install Apps + Game Ringan
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @(
            @{id='Discord.Discord'; name='Discord'},
            @{id='Google.Chrome'; name='Chrome'},
            @{id='VideoLAN.VLC'; name='VLC'},
            @{id='Valve.Steam'; name='Steam'},
            @{id='PrismLauncher.PrismLauncher'; name='PrismLauncher (Minecraft)'},
            @{id='7zip.7zip'; name='7-Zip'}
          )
          foreach ($app in $apps) {
            Write-Host "[+] Install $($app.name)..."
            try {
              winget install --id $($app.id) --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            } catch { Write-Host "[!] $($app.name) gagal" }
          }
          Get-Process Discord -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0
          exit 0

      # ============ STEP 6 - OXZCHAT + INFO DEV + ADMIN ============
      - name: 6. OxzChat + Info Developer + Admin
        shell: pwsh
        continue-on-error: true
        run: |
          $Desktop = 'C:\Users\Public\Desktop'
          $Shell = New-Object -ComObject WScript.Shell
          
          # OxzChat Messenger
          $scChat = $Shell.CreateShortcut("$Desktop\OxzChat Messenger.url")
          $scChat.TargetPath = 'https://oxzchatmessenger.vercel.app'
          $scChat.Save()
          
          # Info Developer
          $devInfo = @()
          $devInfo += '==============================================='
          $devInfo += '   OXZRDP V10 - INFO DEVELOPER'
          $devInfo += '==============================================='
          $devInfo += ''
          $devInfo += 'Nama Asli     : Rafandra Darrel Juliano'
          $devInfo += 'Nama Panggilan: Yannzz'
          $devInfo += 'Tim           : OxzStudios'
          $devInfo += ''
          $devInfo += '==============================================='
          $devInfo += '   APLIKASI'
          $devInfo += '==============================================='
          $devInfo += 'OxzChat Messenger'
          $devInfo += 'URL: https://oxzchatmessenger.vercel.app'
          $devInfo += ''
          $devInfo += '==============================================='
          $devInfo += '   ADMIN / DUKUNGAN DEVELOPER'
          $devInfo += '==============================================='
          $devInfo += 'WhatsApp Admin : +62 851-6157-1110'
          $devInfo += 'Chat Langsung  : https://wa.me/6285161571110'
          $devInfo += ''
          $devInfo += 'Dukung developer via GoPay ke nomor di atas.'
          $devInfo += 'Terima kasih buat yang udah support!'
          $devInfo += ''
          $devInfo += '==============================================='
          $devInfo += '   WEBSITE & COMMUNITY'
          $devInfo += '==============================================='
          $devInfo += 'Website   : https://oxzratxone-official.netlify.app'
          $devInfo += 'Community : https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3'
          $devInfo += '==============================================='
          $devInfo | Out-File -FilePath "$Desktop\INFO-DEVELOPER.txt" -Encoding utf8
          
          # Admin Shortcut
          $scAdmin = $Shell.CreateShortcut("$Desktop\Admin OXZRDP.lnk")
          $scAdmin.TargetPath = 'https://wa.me/6285161571110?text=Halo%20Admin%20OXZRDP'
          $scAdmin.Save()
          
          # GoPay Shortcut
          $scGopay = $Shell.CreateShortcut("$Desktop\Dukung Developer (GoPay).lnk")
          $scGopay.TargetPath = 'https://wa.me/6285161571110?text=Saya%20mau%20dukung%20developer%20OXZRDP%20via%20GoPay'
          $scGopay.Save()
          
          # Shortcut lain
          $list = @(
            @{n='Website OXZ.url'; t='https://oxzratxone-official.netlify.app'},
            @{n='Community WhatsApp.url'; t='https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3'},
            @{n='YouTube.url'; t='https://www.youtube.com'},
            @{n='Speed Test.url'; t='https://fast.com'}
          )
          foreach ($item in $list) {
            $s = $Shell.CreateShortcut("$Desktop\$($item.n)")
            $s.TargetPath = $item.t
            $s.Save()
          }
          
          Write-Host '[OK] OxzChat + Info Dev + Admin terpasang'

      # ============ STEP 7 - CHANGELOG + GAME INFO ============
      - name: 7. Changelog + Game Info
        shell: pwsh
        continue-on-error: true
        run: |
          $Desktop = 'C:\Users\Public\Desktop'
          
          $cl = @()
          $cl += '==============================================='
          $cl += '   OXZRDP V10 - CHANGELOG'
          $cl += '   By Yannzz (Rafandra Darrel Juliano)'
          $cl += '==============================================='
          $cl += ''
          $cl += 'V10 (Sekarang)'
          $cl += '==============================================='
          $cl += '[+] Rename Nama PC (bukan user)'
          $cl += '[+] Tampilan mirip Windows 11 (cosmetic)'
          $cl += '[+] OxzChat Messenger'
          $cl += '[+] Info Developer (Rafandra Darrel Juliano / Yannzz)'
          $cl += '[+] Admin WhatsApp +62 851-6157-1110'
          $cl += '[+] Discord + Chrome + VLC + Steam'
          $cl += '[+] PrismLauncher (Minecraft)'
          $cl += '[+] Optimasi Anti Lag'
          $cl += ''
          $cl += 'CATATAN:'
          $cl += '- Windows Server (runner GitHub)'
          $cl += '- RAM 7 GB (standard runner)'
          $cl += '- Roblox TIDAK SUPPORT'
          $cl += '- Game berat TIDAK SUPPORT'
          $cl += ''
          $cl += 'GAME YANG BISA:'
          $cl += '- Minecraft Java (PrismLauncher)'
          $cl += '- Stardew Valley'
          $cl += '- Terraria'
          $cl += '- Among Us'
          $cl += '- Game indie 2D'
          $cl += ''
          $cl += '==============================================='
          $cl += 'OxzChat : https://oxzchatmessenger.vercel.app'
          $cl += 'Admin   : +62 851-6157-1110'
          $cl += 'Website : https://oxzratxone-official.netlify.app'
          $cl += 'Community: https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3'
          $cl += '==============================================='
          $cl | Out-File -FilePath "$Desktop\CHANGELOG.txt" -Encoding utf8
          
          Write-Host '[OK] Changelog terpasang'

      # ============ STEP 8 - TAILSCALE + INFO + KEEP ALIVE ============
      - name: 8. Tailscale + Info + Keep Alive
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.OXZ_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=NO-KEY"
          } else {
            try {
              $msi = "$env:TEMP\ts.msi"
              Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' -OutFile $msi
              Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait
              Start-Sleep -Seconds 5
              
              $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
              if (Test-Path $tsExe) {
                $hostname = "OXZRDP-V10-$((Get-Random -Min 100 -Max 999))"
                & $tsExe up --authkey=$env:TS_AUTHKEY --hostname=$hostname --accept-routes 2>&1 | Write-Host
                
                $ip = $null
                for ($i = 1; $i -le 24; $i++) {
                  Start-Sleep -Seconds 5
                  $ipCheck = & $tsExe ip -4 2>$null
                  if (-not [string]::IsNullOrWhiteSpace($ipCheck)) { $ip = $ipCheck; break }
                }
                
                if ([string]::IsNullOrWhiteSpace($ip)) {
                  Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=TAILSCALE-GAGAL"
                } else {
                  Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=$ip"
                }
              }
            } catch {
              Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=ERROR"
            }
          }
          
          Write-Host ""
          Write-Host "==============================================="
          Write-Host " [ OXZRDP V10 - ONLINE ]"
          Write-Host " By Yannzz (Rafandra Darrel Juliano)"
          Write-Host "==============================================="
          Write-Host " IP ADDRESS : $env:OXZRDP_IP"
          Write-Host " USERNAME   : $env:OXZRDP_USER"
          Write-Host " PASSWORD   : $env:OXZRDP_PASS"
          Write-Host " DURASI     : 1 HARI"
          Write-Host " VERSI      : V10"
          Write-Host " RAM        : 7 GB"
          Write-Host "==============================================="
          Write-Host " OxzChat    : https://oxzchatmessenger.vercel.app"
          Write-Host " Admin      : +62 851-6157-1110"
          Write-Host " Website    : https://oxzratxone-official.netlify.app"
          Write-Host " Community  : https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3"
          Write-Host "==============================================="
          
          $endTime = (Get-Date).AddMinutes(1435)
          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Online | IP: $env:OXZRDP_IP | Sisa: $($remaining.ToString('hh\:mm\:ss'))"
            Start-Sleep -Seconds 300
          }
