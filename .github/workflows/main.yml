      # ============ STEP 10 - TAILSCALE + INFO + KEEP ALIVE ============
      - name: 10. Tailscale + Info Akses + Keep Alive
        shell: pwsh
        run: |
          $authkey = '${{ secrets.OXZ_KEY }}'
          if ([string]::IsNullOrWhiteSpace($authkey)) {
            Write-Host "[ERROR] Secret OXZ_KEY KOSONG!"
            Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=SECRET-KOSONG"
          } else {
            try {
              $msi = "$env:TEMP\ts.msi"
              Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' -OutFile $msi
              Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait
              Start-Sleep -Seconds 5
              
              $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
              if (Test-Path $tsExe) {
                $hostname = "OXZRDP-PRO-$((Get-Random -Min 100 -Max 999))"
                & $tsExe up --authkey=$authkey --hostname=$hostname --accept-routes 2>&1 | Write-Host
                
                $ip = $null
                for ($i = 1; $i -le 24; $i++) {
                  Start-Sleep -Seconds 5
                  $ipCheck = & $tsExe ip -4 2>$null
                  if (-not [string]::IsNullOrWhiteSpace($ipCheck)) {
                    $ip = $ipCheck
                    break
                  }
                }
                
                if ([string]::IsNullOrWhiteSpace($ip)) {
                  Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=TAILSCALE-GAGAL"
                } else {
                  Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=$ip"
                }
              }
            } catch {
              Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=ERROR"
            }
          }
          
          Write-Host ""
          Write-Host "==============================================="
          Write-Host " [ OXZRDP PRO V4.2 - ONLINE ]"
          Write-Host "==============================================="
          Write-Host " IP ADDRESS : $env:OXZRDP_IP"
          Write-Host " USERNAME   : $env:OXZRDP_USER"
