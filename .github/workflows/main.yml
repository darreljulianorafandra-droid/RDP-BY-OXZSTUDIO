          $changelog += 'FITUR YANG AKAN DATANG V4.2'
          $changelog += '==============================================='
          $changelog += '[*] QR Code Connect'
          $changelog += '[*] Auto Screen Record'
          $changelog += '[*] Bot Telegram'
          $changelog += '[*] NoVNC Web Client'
