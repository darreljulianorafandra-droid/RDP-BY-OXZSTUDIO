name: OXZRDP-PRO-V4.2

on:
  workflow_dispatch:

jobs:
  deployment:
    runs-on: windows-latest
    timeout-minutes: 1440

    steps:
      # ============ STEP 1 - RDP + RENAME ============
      - name: 1. Enable RDP + Rename Device
        shell: pwsh
        continue-on-error: true
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          netsh advfirewall firewall set rule group='remote desktop' new enable=Yes
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
          $newName = "OXZRDP-PRO-$((Get-Random -Min 100 -Max 999))"
          Rename-Computer -NewName $newName -Force -ErrorAction SilentlyContinue
          Write-Host "[OK] Device: $newName"

      # ============ STEP 2 - USER + WINDOWS UPDATE ============
      - name: 2. Bikin User + Windows Update
        shell: pwsh
        continue-on-error: true
        run: |
          $id = Get-Random -Minimum 1000 -Maximum 9999
          $u = "UserOxz$id"
          $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789')
          $p = ''
          foreach ($s in $sets) { $p += $s[(Get-Random -Maximum $s.Length)] }
          $all = -join $sets
          for ($i = 1; $i -le 11; $i++) { $p += $all[(Get-Random -Maximum $all.Length)] }
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_USER=$u"
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_PASS=$p"
          net user $u $p /add /y
          net localgroup Administrators $u /add
          net localgroup 'Remote Desktop Users' $u /add
          Set-Service -Name wuauserv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name wuauserv -ErrorAction SilentlyContinue
          Write-Host "[OK] User $u dibuat"

      # ============ STEP 3 - WALLPAPER + THEME ============
      - name: 3. Wallpaper + Theme Market
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Invoke-WebRequest -Uri 'https://files.catbox.moe/yfz3h8.jpg' -OutFile 'C:\Windows\Web\Wallpaper\oxzrdp.jpg' -UseBasicParsing -TimeoutSec 60
            Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'Wallpaper' -Value 'C:\Windows\Web\Wallpaper\oxzrdp.jpg' -Force
            Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'WallpaperStyle' -Value '10' -Force
            Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'TileWallpaper' -Value '0' -Force
            Write-Host '[OK] Wallpaper terpasang'
          } catch {
            Write-Host '[!] Wallpaper gagal'
          }
          
          $themeDir = 'C:\OXZRDP\Themes'
          New-Item -ItemType Directory -Path $themeDir -Force | Out-Null
          $themes = @(
            @{n='Win11-Bloom'; u='https://images.unsplash.com/photo-1633511090164-b43840ea90bf?w=1920'},
            @{n='Dark-Abstract'; u='https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1920'},
            @{n='Blue-Gradient'; u='https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=1920'},
            @{n='Space-Galaxy'; u='https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920'}
          )
          foreach ($t in $themes) {
            try {
              Invoke-WebRequest -Uri $t.u -OutFile "$themeDir\$($t.n).jpg" -UseBasicParsing -TimeoutSec 30
              Write-Host "[OK] Tema $($t.n)"
            } catch { }
          }

      # ============ STEP 4 - OPTIMASI ============
      - name: 4. Optimasi Anti Lag
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @('*Microsoft.Office*','*OneDrive*','*SkypeApp*','*XboxApp*','*BingNews*','*BingWeather*','*GetHelp*','*ZuneMusic*','*ZuneVideo*','*People*','*Maps*','*Todos*')
          foreach ($app in $apps) {
            Get-AppxPackage -Name $app -AllUsers -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue
          }
          $services = @('DiagTrack','dmwappushservice','SysMain','MapsBroker','RetailDemo','WMPNetworkSvc')
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' -Name 'NetworkThrottlingIndex' -Value 0xffffffff -Force -ErrorAction SilentlyContinue
          netsh int tcp set global autotuninglevel=normal
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          Write-Host '[OK] Optimasi selesai'

      # ============ STEP 5 - APPS UTAMA ============
      - name: 5. Install Apps Utama (Discord + Chrome + Spotify + VLC + Notepad++ + WhatsApp)
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @(
            @{id='Discord.Discord'; name='Discord'},
            @{id='Google.Chrome'; name='Chrome'},
            @{id='Spotify.Spotify'; name='Spotify'},
            @{id='VideoLAN.VLC'; name='VLC'},
            @{id='Notepad++.Notepad++'; name='Notepad++'},
            @{id='WhatsApp.WhatsApp'; name='WhatsApp'}
          )
          foreach ($app in $apps) {
            Write-Host "[+] Install $($app.name)..."
            try {
              winget install --id $($app.id) --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            } catch { }
          }
          Get-Process Discord -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0
          exit 0

      # ============ STEP 6 - STEAM + OFFICE + TOOLS ============
      - name: 6. Install Steam + LibreOffice + 7-Zip + CPU-Z
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @(
            @{id='Valve.Steam'; name='Steam'},
            @{id='TheDocumentFoundation.LibreOffice'; name='LibreOffice'},
            @{id='7zip.7zip'; name='7-Zip'},
            @{id='CPUID.CPU-Z'; name='CPU-Z'}
          )
          foreach ($app in $apps) {
            Write-Host "[+] Install $($app.name)..."
            try {
              winget install --id $($app.id) --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            } catch { }
          }
          $global:LASTEXITCODE = 0
          exit 0

      # ============ STEP 7 - MULTIMEDIA + UTILITY ============
      - name: 7. Install OBS + Zoom + GIMP + 7-Zip + Bitwarden + Audacity + Tor + CCleaner
        shell: pwsh
        continue-on-error: true
        run: |
          $apps = @(
            @{id='OBSProject.OBSStudio'; name='OBS Studio'},
            @{id='Zoom.Zoom'; name='Zoom'},
            @{id='GIMP.GIMP'; name='GIMP'},
            @{id='Bitwarden.Bitwarden'; name='Bitwarden'},
            @{id='Audacity.Audacity'; name='Audacity'},
            @{id='TorProject.TorBrowser'; name='Tor Browser'},
            @{id='Piriform.CCleaner'; name='CCleaner'}
          )
          foreach ($app in $apps) {
            Write-Host "[+] Install $($app.name)..."
            try {
              winget install --id $($app.id) --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            } catch { }
          }
          $global:LASTEXITCODE = 0
          exit 0

      # ============ STEP 8 - ROBOT INFO ============
      - name: 8. Robot Info Desktop
        shell: pwsh
        continue-on-error: true
        run: |
          $toolDir = 'C:\OXZRDP'
          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null
          Add-Type -AssemblyName System.Drawing
          
          $ico = New-Object System.Drawing.Bitmap 256, 256
          $g = [System.Drawing.Graphics]::FromImage($ico)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::White)
          $blue = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(50, 120, 220))
          $white = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::White)
          $black = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::Black)
          $g.FillRectangle($blue, 60, 90, 136, 120)
          $g.FillRectangle($blue, 80, 40, 96, 60)
          $g.FillEllipse($white, 100, 60, 20, 20)
          $g.FillEllipse($white, 136, 60, 20, 20)
          $g.FillEllipse($black, 108, 66, 10, 10)
          $g.FillEllipse($black, 144, 66, 10, 10)
          $g.FillRectangle($black, 110, 82, 36, 6)
          $pen = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(50, 120, 220)), 4
          $g.DrawLine($pen, 128, 40, 128, 15)
          $g.FillEllipse($blue, 120, 5, 16, 16)
          $g.FillRectangle($blue, 30, 110, 25, 80)
          $g.FillRectangle($blue, 201, 110, 25, 80)
          $g.FillRectangle($blue, 80, 215, 40, 30)
          $g.FillRectangle($blue, 136, 215, 40, 30)
          $g.Dispose()
          $pngPath = "$toolDir\robot.png"
          $ico.Save($pngPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $ico.Dispose()
          
          $infoPath = "$toolDir\Tentang-OXZRDP.ps1"
          $lines = @()
          $lines += 'Add-Type -AssemblyName PresentationFramework'
          $lines += '$msg = "========================================`n   OXZRDP PRO V4.2 - TENTANG`n========================================`n`n  Versi     : V4.2`n  Developer : Yannzz dan OxzStudios`n  Platform  : GitHub Actions + Tailscale`n`n========================================`n   FITUR AKTIF V4.2`n========================================`n  - Steam Client`n  - LibreOffice (Word alternative)`n  - WiFi Manager`n  - Bug Reporter WhatsApp`n  - Discord, Chrome, Spotify, VLC`n  - WhatsApp Desktop, Notepad++`n  - OBS Studio, Zoom, GIMP`n  - 7-Zip, CPU-Z, CCleaner`n  - Bitwarden, Audacity, Tor Browser`n  - Theme Market (4 tema)`n  - Play Store + APK Downloader`n  - System Monitor, Benchmark`n  - Wallpaper dari URL`n`n========================================`n   BUG REPORT`n========================================`n  WhatsApp : +62 851-6157-1110`n  Chat     : https://wa.me/6285161571110`n`n========================================`n   WEBSITE dan COMMUNITY`n========================================`n  Website   : https://oxzratxone-official.netlify.app`n  Community : https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3`n`n========================================`n  (c) 2026 Yannzz dan OxzStudios`n========================================"'
          $lines += '$window = New-Object System.Windows.Window'
          $lines += '$window.Title = "Tentang OXZRDP PRO V4.2"'
          $lines += '$window.Width = 650'
          $lines += '$window.Height = 750'
          $lines += '$window.WindowStartupLocation = "CenterScreen"'
          $lines += '$window.Background = "White"'
          $lines += '$scroll = New-Object System.Windows.Controls.ScrollViewer'
          $lines += '$tb = New-Object System.Windows.Controls.TextBox'
          $lines += '$tb.Text = $msg'
          $lines += '$tb.FontFamily = "Consolas"'
          $lines += '$tb.FontSize = 12'
          $lines += '$tb.IsReadOnly = $true'
          $lines += '$tb.Background = "White"'
          $lines += '$tb.BorderThickness = 0'
          $lines += '$tb.Margin = "10"'
          $lines += '$scroll.Content = $tb'
          $lines += '$window.Content = $scroll'
          $lines += '$window.ShowDialog() | Out-Null'
          $lines -join "`n" | Out-File -FilePath $infoPath -Encoding utf8
          
          $Shell = New-Object -ComObject WScript.Shell
          $sc = $Shell.CreateShortcut('C:\Users\Public\Desktop\Tentang OXZRDP.lnk')
          $sc.TargetPath = 'powershell.exe'
          $sc.Arguments = "-ExecutionPolicy Bypass -WindowStyle Hidden -File `"$infoPath`""
          $sc.IconLocation = "$pngPath,0"
          $sc.Save()
          Write-Host '[OK] Robot Info terpasang'

      # ============ STEP 9 - WIFI MANAGER ============
      - name: 9. WiFi Manager
        shell: pwsh
        continue-on-error: true
        run: |
          $toolDir = 'C:\OXZRDP'
          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null
          
          # Bikin script WiFi info (text-based, gak pakai GUI)
          $wifiPath = "$toolDir\WiFiInfo.ps1"
          $lines = @()
          $lines += 'Write-Host "===== OXZRDP V4.2 - WIFI INFO =====" -ForegroundColor Cyan'
          $lines += 'Write-Host ""'
          $lines += 'Write-Host "--- WiFi Networks ---" -ForegroundColor Yellow'
          $lines += '$wifi = netsh wlan show networks mode=bssid 2>$null'
          $lines += 'if ($wifi) { $wifi | Write-Host } else { Write-Host "WiFi adapter tidak ada di VM (normal)." }'
          $lines += 'Write-Host ""'
          $lines += 'Write-Host "--- IP Configuration ---" -ForegroundColor Yellow'
          $lines += 'ipconfig | Write-Host'
          $lines += 'Write-Host ""'
          $lines += 'Write-Host "--- Tailscale Status ---" -ForegroundColor Yellow'
          $lines += '$tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"'
          $lines += 'if (Test-Path $tsExe) { & $tsExe status | Write-Host } else { Write-Host "Tailscale belum install." }'
          $lines += 'Write-Host ""'
          $lines += 'Read-Host "Enter untuk keluar"'
          $lines -join "`n" | Out-File -FilePath $wifiPath -Encoding utf8
          
          $Shell = New-Object -ComObject WScript.Shell
          $sc = $Shell.CreateShortcut('C:\Users\Public\Desktop\WiFi Manager.lnk')
          $sc.TargetPath = 'powershell.exe'
          $sc.Arguments = "-ExecutionPolicy Bypass -NoExit -File `"$wifiPath`""
          $sc.IconLocation = 'C:\Windows\System32\shell32.dll,17'
          $sc.Save()
          Write-Host '[OK] WiFi Manager terpasang'

      # ============ STEP 10 - BUG REPORTER + SHORTCUT ============
      - name: 10. Bug Reporter + Changelog + Shortcut
        shell: pwsh
        continue-on-error: true
        run: |
          $Desktop = 'C:\Users\Public\Desktop'
          $Shell = New-Object -ComObject WScript.Shell
          
          # Shortcut URL
          $list = @(
            @{n='Steam.url'; t='https://store.steampowered.com'},
            @{n='Play Store.url'; t='https://play.google.com/store'},
            @{n='APK Downloader.url'; t='https://apkpure.com'},
            @{n='Vortexzzx-WEB.url'; t='https://oxzratxone-official.netlify.app'},
            @{n='Community WhatsApp.url'; t='https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3'},
            @{n='Spotify Web.url'; t='https://open.spotify.com'},
            @{n='YouTube.url'; t='https://www.youtube.com'},
            @{n='Speed Test.url'; t='https://fast.com'},
            @{n='Windows Update.url'; t='ms-settings:windowsupdate'}
          )
          foreach ($item in $list) {
            $s = $Shell.CreateShortcut("$Desktop\$($item.n)")
            $s.TargetPath = $item.t
            $s.Save()
          }
          
          # Bug Reporter
          $scBug = $Shell.CreateShortcut("$Desktop\Lapor Bug WhatsApp.lnk")
          $scBug.TargetPath = 'https://wa.me/6285161571110?text=Halo%20saya%20mau%20lapor%20bug%20OXZRDP%20V4.2'
          $scBug.Save()
          
          $bugInfo = @()
          $bugInfo += 'OXZRDP V4.2 - BUG REPORTER'
          $bugInfo += '========================'
          $bugInfo += ''
          $bugInfo += 'Kalau nemu bug, kirim ke:'
          $bugInfo += 'WhatsApp : +62 851-6157-1110'
          $bugInfo += 'Chat     : https://wa.me/6285161571110'
          $bugInfo += ''
          $bugInfo += 'Format laporan:'
          $bugInfo += 'Nama   : [nama]'
          $bugInfo += 'Step   : [step berapa]'
          $bugInfo += 'Error  : [copy paste]'
          $bugInfo += 'Screenshot: [attach]'
          $bugInfo | Out-File -FilePath "$Desktop\BUG-REPORTER.txt" -Encoding utf8
          
          # Changelog
          $cl = @()
          $cl += '==============================================='
          $cl += '   OXZRDP PRO - CHANGELOG'
          $cl += '   By Yannzz dan OxzStudios'
          $cl += '==============================================='
          $cl += ''
          $cl += 'V4.2 (Sekarang) - RELEASE'
          $cl += '==============================================='
          $cl += '[+] Steam Client'
          $cl += '[+] LibreOffice (Word alternative)'
          $cl += '[+] WiFi Manager'
          $cl += '[+] Bug Reporter WhatsApp +62 851-6157-1110'
          $cl += '[+] OBS Studio, Zoom, GIMP'
          $cl += '[+] 7-Zip, CPU-Z, CCleaner'
          $cl += '[+] Bitwarden, Audacity, Tor Browser'
          $cl += '[+] Theme Market'
          $cl += '[+] Play Store + APK Downloader'
          $cl += ''
          $cl += 'V4.1 - STABLE'
          $cl += '==============================================='
          $cl += '[+] Play Store shortcut'
          $cl += '[+] Theme Market'
          $cl += '[+] Changelog'
          $cl += '[+] WhatsApp Desktop'
          $cl += ''
          $cl += 'V3.2 - STABLE'
          $cl += '==============================================='
          $cl += '[+] Wallpaper dari URL'
          $cl += '[+] Windows Update aktif'
          $cl += '[+] Rename device otomatis'
          $cl += '[+] Robot Info Desktop'
          $cl += '[+] Discord, Chrome, Spotify, VLC, Notepad++'
          $cl += ''
          $cl += 'V3.1 - STABLE'
          $cl += '==============================================='
          $cl += '[+] Robot Info taskbar'
          $cl += '[+] Wallpaper putih polos'
          $cl += '[+] Optimasi anti lag'
          $cl += ''
          $cl += '==============================================='
          $cl += 'FITUR YANG AKAN DATANG V4.3'
          $cl += '==============================================='
          $cl += '[*] QR Code Connect'
          $cl += '[*] Auto Screen Record'
          $cl += '[*] Bot Telegram'
          $cl += '[*] NoVNC Web Client'
          $cl += '[*] Live Dashboard'
          $cl += '[*] AI Assistant'
          $cl += ''
          $cl += '==============================================='
          $cl += 'Website   : https://oxzratxone-official.netlify.app'
          $cl += 'Community : https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3'
          $cl += 'Bug Report: +62 851-6157-1110'
          $cl += '==============================================='
          $cl | Out-File -FilePath "$Desktop\CHANGELOG.txt" -Encoding utf8
          $cl | Out-File -FilePath 'C:\Users\Public\Documents\OXZRDP-CHANGELOG.txt' -Encoding utf8
          
          Write-Host '[OK] Bug Reporter + Changelog + Shortcut terpasang'

    # ============ STEP 11 - TAILSCALE + INFO + KEEP ALIVE ============== #
     name: 11. Tailscale + Info Akses + Keep Alive
   shell: pwsh
  env:
    TS_AUTHKEY: ${{ secrets.OXZ_KEY }}
  run: |
    if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
      Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=NO-KEY"
    } else {
      try {
        $msi = "$env:TEMP\ts.msi"
        Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' -OutFile $msi
        Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait
        Start-Sleep -Seconds 5
        
        $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
        if (Test-Path $tsExe) {
          $hostname = "OXZRDP-PRO-$((Get-Random -Min 100 -Max 999))"
          & $tsExe up --authkey=$env:TS_AUTHKEY --hostname=$hostname --accept-routes 2>&1 | Write-Host
          
          $ip = $null
          for ($i = 1; $i -le 24; $i++) {
            Start-Sleep -Seconds 5
            $ipCheck = & $tsExe ip -4 2>$null
            if (-not [string]::IsNullOrWhiteSpace($ipCheck)) {
              $ip = $ipCheck
              break
            }
          }
          
          if ([string]::IsNullOrWhiteSpace($ip)) {
            Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=TAILSCALE-GAGAL"
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=$ip"
          }
        }
      } catch {
        Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=ERROR"
      }
    }
    
    Write-Host ""
    Write-Host "==============================================="
    Write-Host " [ OXZRDP PRO V4.2 - ONLINE ]"
    Write-Host "==============================================="
    Write-Host " IP ADDRESS : $env:OXZRDP_IP"
    Write-Host " USERNAME   : $env:OXZRDP_USER"
    Write-Host " PASSWORD   : $env:OXZRDP_PASS"
    Write-Host " DURASI     : 1 HARI"
    Write-Host " VERSI      : V4.2"
    Write-Host "==============================================="
    Write-Host " BUG REPORT : +62 851-6157-1110"
    Write-Host " Website    : https://oxzratxone-official.netlify.app"
    Write-Host " Community  : https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3"
    Write-Host "==============================================="
    
    $endTime = (Get-Date).AddMinutes(1435)
    while ((Get-Date) -lt $endTime) {
      $remaining = $endTime - (Get-Date)
      Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Online | IP: $env:OXZRDP_IP | Sisa: $($remaining.ToString('hh\:mm\:ss'))"
      Start-Sleep -Seconds 300
    }
